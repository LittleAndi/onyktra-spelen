name: Driftsätt till GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publicera bara appens filer, inte dokumentation och verktyg.
      - name: Samla appfiler
        run: |
          mkdir _site
          tar -c \
            --exclude=./.git --exclude=./.github --exclude=./.claude --exclude=./_site \
            --exclude=./docs --exclude=./scripts --exclude='*.md' --exclude=./config.example.json \
            . | tar -x -C _site
          touch _site/.nojekyll
          find _site -type f | sort

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
