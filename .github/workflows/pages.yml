name: Driftsätt till GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publicera bara appens filer, inte dokumentation och verktyg.
      - name: Samla appfiler
        run: |
          mkdir _site
          tar -c \
            --exclude=./.git --exclude=./.github --exclude=./.claude --exclude=./_site \
            --exclude=./docs --exclude=./scripts --exclude=./clips/original --exclude='*.md' --exclude=./config.example.json \
            . | tar -x -C _site
          touch _site/.nojekyll
          find _site -type f | sort

      # Client ID från repovariabeln SPOTIFY_CLIENT_ID (inte hemlig – syns ändå i config.json på sidan).
      - name: Sätt Spotify client ID
        if: vars.SPOTIFY_CLIENT_ID != ''
        env:
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
        run: |
          jq --arg id "$SPOTIFY_CLIENT_ID" '.spotifyClientId = $id' _site/config.json > _site/config.tmp
          mv _site/config.tmp _site/config.json
          echo "spotifyClientId satt i config.json"

      # Ny cacheversion i sw.js när någon publicerad fil ändrats → telefonen hämtar den nya versionen.
      - name: Sätt service worker-version
        run: |
          hash=$(cd _site && find . -type f ! -name sw.js -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-12)
          grep -q "'onyktra-dev'" _site/sw.js || { echo "Hittar inte 'onyktra-dev' i sw.js"; exit 1; }
          sed -i "s/'onyktra-dev'/'onyktra-$hash'/" _site/sw.js
          echo "Service worker-version: onyktra-$hash"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
