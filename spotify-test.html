<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1620">
<title>OS – Spotify-test</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<style>
  .steg { display: flex; flex-direction: column; gap: 8px; }
  .steg button { min-height: 52px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
  .steg button.primar { background: var(--accent); color: var(--bg); border: none; }
  .steg input { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); padding: 0 12px; font: inherit; }
  #logg { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; min-height: 120px; }
  .ok { color: var(--ice); } .fel { color: var(--warn); border: none; padding: 0; background: none; }
  p { margin: 0; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main class="screen">
  <header>
    <div class="eyebrow">OS · Testsida</div>
    <h1>Spotify-test</h1>
  </header>
  <p>Testar inloggning (PKCE), Web Playback SDK som egen enhet, uppspelning och ett Web Audio-pip ovanpå musiken med ducking.</p>

  <div class="steg" id="klientid-rad" hidden>
    <label for="klientid">Spotify client ID</label>
    <input id="klientid" autocomplete="off" autocapitalize="off" spellcheck="false">
  </div>

  <div class="steg">
    <button type="button" id="logga-in" class="primar">1. Logga in med Spotify</button>
    <button type="button" id="starta" disabled>2. Starta spelaren</button>
    <button type="button" id="spela" disabled>3. Spela testlåt</button>
    <button type="button" id="pip" disabled>4. Pip ovanpå (med ducking)</button>
    <button type="button" id="logga-ut">Logga ut</button>
  </div>

  <div id="logg"></div>
</main>

<script type="module">
const SCOPES = 'streaming user-read-email user-read-private user-modify-playback-state user-read-playback-state';
const redirectUri = location.origin + location.pathname;
const $ = (id) => document.getElementById(id);

function logg(text, klass = '') {
  const rad = document.createElement('div');
  rad.className = klass;
  rad.textContent = `${new Date().toLocaleTimeString('sv-SE')}  ${text}`;
  $('logg').append(rad);
}

let clientId = '';
try {
  const config = await (await fetch('config.json', { cache: 'no-cache' })).json();
  clientId = config.spotifyClientId;
} catch {}
if (!clientId || clientId === 'DIN_CLIENT_ID') {
  $('klientid-rad').hidden = false;
  $('klientid').value = localStorage.getItem('test.clientId') || '';
  $('klientid').addEventListener('input', (e) => localStorage.setItem('test.clientId', e.target.value.trim()));
  clientId = null;
}
const getClientId = () => clientId || localStorage.getItem('test.clientId');

logg(`Redirect-URI: ${redirectUri}`);
logg(`Säker kontext: ${window.isSecureContext}`);
logg(`Webbläsare: ${navigator.userAgent}`);

// DRM-stöd: Web Playback SDK behöver Widevine.
try {
  await navigator.requestMediaKeySystemAccess('com.widevine.alpha', [{
    initDataTypes: ['cenc'],
    audioCapabilities: [{ contentType: 'audio/mp4; codecs="mp4a.40.2"' }],
  }]);
  logg('Widevine: finns', 'ok');
} catch (e) {
  logg(`Widevine: saknas (${e.name})`, 'fel');
}

// --- PKCE ---
const base64url = (bytes) => btoa(String.fromCharCode(...new Uint8Array(bytes)))
  .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

async function loggaIn() {
  const id = getClientId();
  if (!id) { logg('Ange client ID först', 'fel'); return; }
  const verifier = base64url(crypto.getRandomValues(new Uint8Array(48)));
  const challenge = base64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  sessionStorage.setItem('test.verifier', verifier);
  const url = new URL('https://accounts.spotify.com/authorize');
  url.search = new URLSearchParams({
    response_type: 'code', client_id: id, scope: SCOPES,
    code_challenge_method: 'S256', code_challenge: challenge, redirect_uri: redirectUri,
  });
  location.href = url;
}

async function hamtaToken(code) {
  const svar = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      grant_type: 'authorization_code', code, redirect_uri: redirectUri,
      client_id: getClientId(), code_verifier: sessionStorage.getItem('test.verifier'),
    }),
  });
  const data = await svar.json();
  if (!svar.ok) throw new Error(`${svar.status} ${data.error}: ${data.error_description}`);
  localStorage.setItem('test.token', data.access_token);
  return data.access_token;
}

let token = localStorage.getItem('test.token');
const params = new URLSearchParams(location.search);
if (params.has('error')) logg(`Inloggning avbröts: ${params.get('error')}`, 'fel');
if (params.has('code')) {
  try {
    token = await hamtaToken(params.get('code'));
    logg('Inloggad, token hämtad', 'ok');
  } catch (e) {
    logg(`Tokenfel: ${e.message}`, 'fel');
  }
  history.replaceState(null, '', location.pathname);
}

async function api(metod, sokvag, kropp) {
  const svar = await fetch(`https://api.spotify.com/v1${sokvag}`, {
    method: metod,
    headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: kropp ? JSON.stringify(kropp) : undefined,
  });
  if (!svar.ok) throw new Error(`${metod} ${sokvag}: ${svar.status} ${await svar.text()}`);
  return svar.status === 204 ? null : svar.json().catch(() => null);
}

if (token) {
  try {
    const mig = await api('GET', '/me');
    logg(`Konto: ${mig.display_name} (${mig.product})`, mig.product === 'premium' ? 'ok' : 'fel');
    $('starta').disabled = false;
  } catch (e) {
    logg(`Token ogiltig, logga in igen: ${e.message}`, 'fel');
    localStorage.removeItem('test.token');
    token = null;
  }
}

// --- Web Playback SDK ---
let player, deviceId, ljud;

function laddaSdk() {
  return new Promise((resolve, reject) => {
    window.onSpotifyWebPlaybackSDKReady = resolve;
    const s = document.createElement('script');
    s.src = 'https://sdk.scdn.co/spotify-player.js';
    s.onerror = () => reject(new Error('Kunde inte ladda SDK'));
    document.head.append(s);
  });
}

async function startaSpelare() {
  $('starta').disabled = true;
  // Lås upp ljud inom användarens tryck (krävs på iOS).
  ljud = new AudioContext();
  await ljud.resume();
  logg(`AudioContext: ${ljud.state}`, ljud.state === 'running' ? 'ok' : 'fel');

  try {
    await laddaSdk();
  } catch (e) { logg(e.message, 'fel'); return; }
  logg('SDK laddat', 'ok');

  player = new Spotify.Player({ name: 'Onyktra Spelen (test)', getOAuthToken: (cb) => cb(token), volume: 0.8 });
  for (const h of ['initialization_error', 'authentication_error', 'account_error', 'playback_error']) {
    player.addListener(h, ({ message }) => logg(`${h}: ${message}`, 'fel'));
  }
  player.addListener('autoplay_failed', () => logg('autoplay_failed: webbläsaren blockerade ljud', 'fel'));
  player.addListener('not_ready', ({ device_id }) => logg(`Enhet offline: ${device_id}`, 'fel'));
  player.addListener('ready', ({ device_id }) => {
    deviceId = device_id;
    logg(`Enhet redo: ${device_id}`, 'ok');
    $('spela').disabled = false;
  });
  player.addListener('player_state_changed', (s) => {
    if (s) logg(`Status: ${s.paused ? 'pausad' : 'spelar'} – ${s.track_window.current_track?.name}`);
  });
  const ok = await player.connect();
  logg(`connect(): ${ok}`, ok ? 'ok' : 'fel');
}

async function spela() {
  try {
    await player.activateElement();
    const sok = await api('GET', '/search?type=track&limit=1&q=' + encodeURIComponent('Gonna Fly Now Bill Conti'));
    const lat = sok.tracks.items[0];
    logg(`Hittade: ${lat.name} – ${lat.artists[0].name}`);
    await api('PUT', `/me/player/play?device_id=${deviceId}`, { uris: [lat.uri], position_ms: 0 });
    logg('Play skickat', 'ok');
    $('pip').disabled = false;
  } catch (e) {
    logg(e.message, 'fel');
  }
}

async function pip() {
  await ljud.resume();
  await player.setVolume(0.3);
  logg('Musik sänkt till 30 %, pip…');
  const osc = ljud.createOscillator();
  const gain = ljud.createGain();
  osc.frequency.value = 880;
  gain.gain.setValueAtTime(0.4, ljud.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ljud.currentTime + 1.5);
  osc.connect(gain).connect(ljud.destination);
  osc.start();
  osc.stop(ljud.currentTime + 1.5);
  osc.onended = async () => {
    await player.setVolume(0.8);
    const s = await player.getCurrentState();
    logg(`Musik tillbaka. Spelar fortfarande: ${s ? !s.paused : 'okänt'}`, s && !s.paused ? 'ok' : 'fel');
  };
}

$('logga-in').addEventListener('click', loggaIn);
$('starta').addEventListener('click', startaSpelare);
$('spela').addEventListener('click', spela);
$('pip').addEventListener('click', pip);
$('logga-ut').addEventListener('click', () => {
  localStorage.removeItem('test.token');
  location.reload();
});

document.addEventListener('visibilitychange', () => logg(`Synlighet: ${document.visibilityState}`));
</script>
</body>
</html>
